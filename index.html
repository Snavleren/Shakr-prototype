{id:"laesoe",title:"Læsø-saltkrisen: Da Danmarks saltstolthed kom under pres",category:"Community-artikel",desc:"En fiktiv debat om tradition, håndværk og hvem der egentlig ejer retten til at kalde sig Danmarks saltfavorit.",author:"Redaktionen",read:"6 min.",date:"28. oktober 2026",featured:true},
{id:"maldon",title:"Maldon mod resten af verden: Er flagerne virkelig pengene værd?",category:"Smag & tekstur",desc:"Vi ser nærmere på den knasende luksus og spørgsmålet om, hvor meget en flage egentlig bør koste.",author:"Maja Korn",read:"4 min.",date:"24. oktober 2026"},

const laesoeBody = `
<p>Der findes råvarer, man køber, og råvarer, man næsten føler sig forpligtet til at have en holdning til. Læsø-salt hører til den sidste kategori. For mange danske saltentusiaster er det ikke bare natriumchlorid i en pæn beholder, men et lille stykke dansk håndværkshistorie: sydende saltvand, dampende hytter og en tradition, der har fået lov at sætte sig i både køkkener og fortællinger.</p>
<p>Derfor var det næppe overraskende, at en diskussion på Shakr begyndte at ulme, da et medlem stillede det tilsyneladende uskyldige spørgsmål: Er Læsø-salt stadig Danmarks nationalsalt? Det var tænkt som en hyggelig meningsmåling. Inden aftenen var omme, var der oprettet tre underspor, en blindtest var foreslået, og nogen havde skrevet ordet “saltidentitet” med versaler.</p>
<h2>Tradition i den ene skål, teknologi i den anden</h2>
<p>I den ene lejr stod tilhængerne af de traditionelle sydemetoder. De fremhævede håndværket, den lokale forankring og den særlige fortælling, der følger med et produkt, hvor processen er en del af oplevelsen. For dem er saltet ikke udskifteligt, selv hvis den kemiske hovedbestanddel er velkendt. Oprindelse og metode betyder noget – ligesom det gør for kaffe, ost eller en god surdej.</p>
<p>Andre pegede på, at moderne produktion kan være mere ensartet og effektiv, og at importerede specialsalte fra hele verden også kan have bemærkelsesværdige teksturer. Hvorfor skulle dansk oprindelse automatisk give førstepladsen? En flage fra den anden side af Nordsøen kan stadig lande elegant på en tomat, lød argumentet, og ingen havde endnu fundet en overbevisende grund til at give den dårligere karakter for sin geografi.</p>
<p>Det var her, diskussionen skiftede fra hyggelig køkkensnak til en slags miniaturetopmøde. Der blev talt om smag, kornstørrelse, fugtighed, pris, bæredygtighed og autenticitet. Flere gjorde opmærksom på, at saltets oplevelse i munden afhænger af krystallernes form og størrelse, og af hvornår saltet tilsættes. Mineralindhold blev også nævnt, men de mere forsigtige stemmer mindede om, at farve og oprindelse ikke i sig selv dokumenterer en særlig ernæringsmæssig fordel.</p>
<h2>Historien kan ikke blindsmages – eller kan den?</h2>
<p>“Når jeg køber Læsø-salt, køber jeg ikke kun smagen. Jeg køber også historien, håndværket og følelsen af, at nogen har gjort sig umage,” skrev den fiktive bruger DampkedelDorte i tråden. “Det er en del af produktet, og det må gerne koste lidt ekstra.”</p>
<p>Modargumentet kom fra BlindSmageren, der foreslog at fjerne etiketterne og lade ganen bestemme. “Hvis saltet vinder, når ingen ved, hvad det hedder, så har det fortjent sin plads. Hvis det kun vinder med en flot historie på glasset, er det måske historien, vi smager på.”</p>
<p>Begge synspunkter rammer noget væsentligt. En blindtest kan undersøge præferencer uden mærkevareforventninger, men den kan ikke afgøre, hvor meget en køber værdsætter håndværk, lokal produktion eller kulturarv. Omvendt kan en stærk historie ikke automatisk gøre et salt mere sprødt, mere velsmagende eller mere egnet til den ret, det skal på. Det er to forskellige spørgsmål, som debatten indimellem blandede sammen i én stor saltkværn.</p>
<h2>Da saltkornene fløj</h2>
<p>På sit mest dramatiske punkt foreslog et medlem, at alle deltagere skulle indsende en blindtestprotokol, mens en anden efterlyste “en uvildig kommission med adgang til tre slags kartofler”. En bruger lavede et regneark med kolonner for knas, eftersmag og “national stolthed på en skala fra 1 til 10”. Regnearket blev liket 42 gange. Det blev også beskyldt for at være forudindtaget.</p>
<p>Det hele foregik naturligvis med den slags alvor, der opstår, når voksne mennesker diskuterer en lille detalje, som ingen andre i lokalet har bedt dem om at forklare. Men under humoren lå et reelt spørgsmål: Hvad gør et salt værd at vælge? Er det smagen, teksturen, prisen, produktionsmetoden, historien – eller kombinationen?</p>
<h2>Ingen endelig dom over saltbøtten</h2>
<p>Shakr-universets saltkrise har endnu ikke fundet en vinder, og det er måske meget passende. Læsø-salt kan være et meningsfuldt valg for den, der værdsætter tradition og håndværk, mens andre salte kan vinde på form, anvendelse eller pris. Der findes ikke én blindtest, der kan afgøre alle de værdier på én gang.</p>
<p>Så nu går spørgsmålet videre til dig: Hvilket salt står fast på din køkkenhylde – og hvorfor? Er det Læsø, flagerne, det grå, det helt almindelige fra skabet eller noget, du fandt på en rejse? Fortæl os det i forum. Vi lover at holde debatten nogenlunde tør.</p>`;

{id:"t3",title:"Er gråt salt altid mere mineralrigt?",author:"NaClNørden",initials:"NN",category:"Spørgsmål",date:"I går · 16.08",likes:19,replies:3,status:"Ny",excerpt:"En diskussion om farve, mineralindhold og dokumentation.",body:"Jeg ser ofte gråt salt beskrevet som “fyldt med mineraler”. Men hvor meget kan farven egentlig fortælle os? Er der nogen, der har læst ordentlige analyser, eller er vi mest ude i markedsføring med en flot grå nuance?",comments:[

<div class="note" style="margin-top:14px">Prototype-note: Shakr er et fiktivt univers. Indlæg, profiler og aktivitet er demoindhold og synkroniseres ikke mellem brugere.</div>`;}
function articlesPage(){let list=articles.filter(a=>(a.title+" "+a.desc+" "+a.category).toLowerCase().includes(articleFilter.toLowerCase()));return `${pageHead("Artikler","Magasinlæsning til dig, der ved, at salt fortjener mere end en plads ved komfuret.")}<div class="toolbar"><input id="article-search" placeholder="Søg blandt artikler..." value="${esc(articleFilter)}" data-action="search-articles"><span class="tag">${list.length} artikler</span></div><div>${list.map(a=>`<article class="article-row" data-article="${a.id}" tabindex="0" role="button"><div class="article-thumb">${iconLine}</div><div><div class="meta"><span class="tag">${a.category}</span><span>${a.date}</span></div><h3>${a.title}</h3><p>${a.desc}</p><div class="meta">${a.author} · ${a.read} læsetid</div></div></article>`).join("")||`<div class="empty">Ingen artikler matcher din søgning.</div>`}</div>`;}
function forumPage(){let list=threads.filter(t=>(forumCategory==="Alle kategorier"||t.category===forumCategory)&&(t.title+" "+t.excerpt+" "+t.author).toLowerCase().includes(searchTerm.toLowerCase()));if(forumSort==="Mest populære")list.sort((a,b)=>threadLikes(b)-threadLikes(a));else if(forumSort==="Flest svar")list.sort((a,b)=>threadCount(b)-threadCount(a));else list.sort((a,b)=>threads.indexOf(a)-threads.indexOf(b));return `${pageHead("Forum","Her mødes saltfolk til smagstests, nørderi og de helt store spørgsmål om små krystaller.")}<div class="toolbar"><input id="forum-search" placeholder="Søg i diskussioner..." value="${esc(searchTerm)}" data-action="search-forum"><select data-action="filter-forum" aria-label="Filtrér kategori">${["Alle kategorier","Saltkultur","Smagstest","Spørgsmål","Udstyr og produktion","Off-topic"].map(c=>`<option ${forumCategory===c?"selected":""}>${c}</option>`).join("")}</select><select data-action="sort-forum" aria-label="Sortér tråde">${["Seneste","Mest populære","Flest svar"].map(c=>`<option ${forumSort===c?"selected":""}>${c}</option>`).join("")}</select><button class="btn black" data-action="new-thread">+ Ny tråd</button></div><div class="meta" style="margin-bottom:13px">${list.length} diskussioner · Fiktive brugere · Lokal demo</div><div class="forum-list">${list.map(threadCard).join("")||`<div class="empty">Ingen tråde matcher filtrene. Prøv en anden søgning eller kategori.</div>`}</div><p class="note" style="margin-top:18px">Forumindholdet er fiktivt. Likes og demosvar gemmes kun lokalt i denne åbne session og synkroniseres ikke med andre brugere.</p>`;}
function threadPage(){const t=threads.find(x=>x.id===currentThread);if(!t)return forumPage();const comments=[...t.comments,...(localReplies[t.id]||[])];return `<div class="thread-detail"><div class="backline"><button class="text-link" data-go="forum">← Tilbage til forumoversigten</button></div><article class="post-main"><div class="meta"><span class="tag">${t.category}</span><span class="tag">${t.status}</span></div><h1>${esc(t.title)}</h1><p style="color:#777">${esc(t.excerpt)}</p><div class="post-byline"><span class="avatar">${t.initials}</span><div><strong>${esc(t.author)}</strong><small>${t.date} · Medlem af Shakr</small></div></div><div class="post-body">${esc(t.body)}</div><div class="post-actions"><button class="btn ${localLikes.has(t.id)?"black":""}" data-action="like" data-id="${t.id}">${localLikes.has(t.id)?"♥ Synes godt om":"♡ Synes godt om"} · ${threadLikes(t)}</button><button class="btn" data-action="reply-toggle">↩ Svar i tråden</button><button class="btn" data-go="forum">Forumoversigt</button></div></article><h2 class="reply-title">${comments.length} svar</h2><div>${comments.map(c=>`<article class="reply"><span class="avatar">${esc(c[1]||c.initials||"DU")}</span><div class="reply-content"><div class="reply-top"><strong>${esc(c[0]||c.author)}</strong><time>${esc(c[2]||c.date)}</time></div><p>${esc(c[3]||c.text)}</p></div></article>`).join("")}</div><div id="reply-form" class="reply-form hidden"><label for="reply-text"><strong>Skriv et svar</strong></label><p class="note">Dit svar vises kun i denne browsers aktuelle session.</p><textarea id="reply-text" placeholder="Del din tanke om saltet..."></textarea><div class="form-row"><span class="note">Vær nysgerrig. Vær salt.</span><button class="btn black" data-action="reply-submit">Indsend demosvar</button></div></div><p class="note">Denne tråd er en del af Shakr-prototypen. Indhold og interaktioner er fiktive og bliver ikke sendt til en server.</p><div class="backline"><button class="btn" data-go="forum">← Tilbage til forum</button></div></div>`;}
function lexiconPage(){let list=lexicon.filter(x=>x.join(" ").toLowerCase().includes(lexFilter.toLowerCase()));return `${pageHead("Saltleksikon","Et lille opslagsværk til saltets former, oprindelser og anvendelser. Færre myter, flere krystaller.")}<div class="toolbar"><input id="lex-search" placeholder="Søg efter salttype, tekstur eller brug..." value="${esc(lexFilter)}" data-action="search-lex"><span class="tag">${list.length} opslag</span></div><div class="lexicon-grid">${list.map((x,i)=>`<article class="lex-card"><div class="lex-icon">${iconLine}</div><h3>${x[0]}</h3><p>${x[1]}</p><dl><dt>Tekstur</dt><dd>${x[2]}</dd><dt>Typisk brug</dt><dd>${x[3]}</dd><dt>Bemærk</dt><dd>${x[4]}</dd></dl></article>`).join("")||`<div class="empty">Ingen opslag fundet.</div>`}</div><p class="note" style="margin-top:18px">Faglig note: Salt består primært af natriumchlorid. Farve, pris eller markedsføring dokumenterer ikke i sig selv særlige sundhedsfordele. Oplysningerne er generelle og kan variere mellem produkter.</p>`;}
function articlePage(){const a=articles.find(x=>x.id===window.currentArticle)||articles[0];if(a.id==="laesoe")return `<div class="article-detail"><div class="backline"><button class="text-link" data-go="articles">← Alle artikler</button></div><div class="meta"><span class="tag darktag">Fiktiv debat i Shakr-universet</span><span>${a.date}</span><span>${a.read} læsetid</span></div><h1>${a.title}</h1><p class="dek">En uro blandt saltentusiaster har sat spørgsmålstegn ved alt fra håndværk og oprindelse til, hvem der egentlig ejer retten til at kalde sig Danmarks saltfavorit.</p><div class="meta">Af Redaktionen · Community-artikel</div><div class="article-hero">${iconCrystal}</div><div class="article-body">${laesoeBody}</div><div class="post-actions"><button class="btn" data-action="save-favorite">Gem artikel</button><button class="btn black" data-go="forum">Diskutér i forum ↗</button></div><p class="note">Denne artikel og den beskrevne saltkrise er fiktive elementer i Shakr-prototypen. De beskriver ikke virkelige hændelser eller en faktisk skandale.</p></div>`;return `<div class="article-detail"><div class="backline"><button class="text-link" data-go="articles">← Alle artikler</button></div><div class="meta"><span class="tag">${a.category}</span><span>${a.date}</span><span>${a.read}</span></div><h1>${a.title}</h1><p class="dek">${a.desc}</p><div class="meta">Af ${a.author} · SHAKR-redaktionen</div><div class="article-hero">${iconCrystal}</div><div class="article-body"><p>${a.desc} Salt virker måske som en beskeden ingrediens, men dets historie spænder fra geologi og håndværk til kemi og køkkenkultur.</p><h2>Det handler om mere end etiketten</h2><p>Saltets egenskaber afhænger blandt andet af krystallernes størrelse og form, fugtighed, fremstillingsmetode og hvordan det bruges. En flage kan give et tydeligt knas, mens fint salt fordeler sig jævnt. Det er praktiske forskelle, som kan mærkes uden at gøre produktet mystisk.</p><p>Det er værd at være nysgerrig på oprindelse og metode – men også at skelne mellem dokumenterede egenskaber og fortællinger på emballagen. Den bedste type er ofte den, der passer til retten og din egen smag.</p><h2>Prøv det selv</h2><p>Smag på to salte side om side, gerne på den samme råvare. Notér tekstur, opløsning og oplevet intensitet, før du kigger på etiketten. Resultatet behøver ikke være videnskabeligt for at være lærerigt.</p></div><button class="btn black" data-action="save-favorite">Gem artikel</button></div>`;}
function searchPage(){const q=searchTerm.toLowerCase();const as=articles.filter(a=>(a.title+" "+a.desc+" "+a.category).toLowerCase().includes(q));const ts=threads.filter(t=>(t.title+" "+t.excerpt+" "+t.category).toLowerCase().includes(q));const ls=lexicon.filter(x=>x.join(" ").toLowerCase().includes(q));return `${pageHead("Søg i saltets verden","Find artikler, samtaler og salttyper på tværs af Shakr.")}<div class="toolbar"><input id="global-search" placeholder="Søg efter fx flagesalt eller Læsø..." value="${esc(searchTerm)}"><button class="btn black" data-action="global-submit">Søg</button></div>${q?`<section class="section"><div class="section-head"><h2>Artikler (${as.length})</h2></div>${as.map(a=>`<article class="article-row" data-article="${a.id}"><div class="article-thumb">${iconLine}</div><div><h3>${a.title}</h3><p>${a.desc}</p><div class="meta">${a.category} · ${a.read}</div></div></article>`).join("")||`<p class="note">Ingen matchende artikler.</p>`}</section><section class="section"><div class="section-head"><h2>Forum (${ts.length})</h2></div><div class="forum-list">${ts.map(threadCard).join("")||`<p class="note">Ingen matchende tråde.</p>`}</div></section><section class="section"><div class="section-head"><h2>Leksikon (${ls.length})</h2></div><div class="lexicon-grid">${ls.map(x=>`<article class="lex-card"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join("")||`<p class="note">Ingen matchende opslag.</p>`}</div></section>`:`<div class="card"><h3>Hvad leder du efter?</h3><p>Prøv “Læsø”, “flager”, “mineraler” eller “blindtest”.</p><div class="toolbar"><button class="btn" data-action="quick-search" data-value="Læsø">Læsø</button><button class="btn" data-action="quick-search" data-value="flager">Flager</button><button class="btn" data-action="quick-search" data-value="mineraler">Mineraler</button></div></div>`}`;}
function profilePage(){return `${pageHead("Min profil","Et lille kig ind i en fiktiv Shakr-profil. Ingen login, ingen adgangskode, bare salt.")}<section class="profile-hero"><span class="avatar">KK</span><div><div class="eyebrow">Medlem siden april 2024</div><h2>KrystalKongen87</h2><p>Entusiast på 3. niveau · Speciale: flagesalt og stærke holdninger</p></div></section><div class="stats"><div class="stat"><strong>47</strong><span>Indlæg</span></div><div class="stat"><strong>286</strong><span>Likes modtaget</span></div><div class="stat"><strong>8</strong><span>Fulgte emner</span></div></div><section class="section"><div class="section-head"><h2>Favoritartikler</h2><span class="tag">Demo</span></div><div class="grid two">${articles.slice(0,2).map(a=>`<article class="card" data-article="${a.id}" tabindex="0" role="button"><span class="tag">${a.category}</span><h3>${a.title}</h3><p>${a.desc}</p><div class="meta">Gemte favoritter · ${a.read}</div></article>`).join("")}</div></section><section class="section"><div class="section-head"><h2>Fulgte emner</h2></div><div class="toolbar"><span class="tag">Flagesalt</span><span class="tag">Læsø-salt</span><span class="tag">Blindtest</span><span class="tag">Saltkultur</span><span class="tag">Køkkenteknik</span></div></section><p class="note">Profilen er fiktiv og kun til demonstration. Den repræsenterer ikke en rigtig bruger eller konto.</p>`;}
function notificationsPage(){return `${pageHead("Notifikationer","Små tegn på, at saltfællesskabet aldrig helt sover.")}<div class="notification"><span class="avatar">NN</span><div><p><strong>NaClNørden</strong> svarede i en tråd, du følger: “Er Læsø-salt stadig Danmarks nationalsalt?”</p><time>For 12 minutter siden</time></div><button class="text-link" data-thread="t1">Se</button></div><div class="notification"><span class="avatar">MS</span><div><p><strong>MaldonSkeptikeren</strong> startede en ny blindtest om flagesalt.</p><time>For 1 time siden</time></div><button class="text-link" data-thread="t2">Se</button></div><div class="notification"><span class="avatar">DD</span><div><p><strong>DampkedelDorte</strong> syntes godt om din kommentar om tradition og håndværk.</p><time>I går</time></div><button class="text-link" data-thread="t1">Se</button></div><div class="notification"><span class="avatar">SH</span><div><p><strong>Shakr-redaktionen</strong> har udgivet en ny artikel i saltleksikonet.</p><time>For 2 dage siden</time></div><button class="text-link" data-go="lexicon">Læs</button></div><p class="note" style="margin-top:20px">Notifikationerne er fiktive eksempler og opdateres ikke fra en server.</p>`;}
function aboutPage(){return `${pageHead("Om Shakr","Salt er mere end bare salt. Og nogle gange er det også en anledning til en meget lang forumtråd.")}<div class="feature-card"><div class="feature-copy"><div class="eyebrow">Vores idé</div><h3>Et hjem for de nysgerrige saltfolk.</h3><p>Shakr er en fiktiv nicheplatform, der samler magasinartikler, saltviden og samtaler om en af køkkenets mest oversete ingredienser.</p><p>Her er der plads til både den metodiske blindtester, den historisk interesserede sydningsromantiker og den, der bare vil vide, hvilket salt der passer til en tomat.</p></div><div class="feature-art">${iconCrystal}</div></div><section class="section"><h2>En prototype – ikke en offentlig tjeneste</h2><p style="color:#777;max-width:700px">Alle brugere, indlæg, tal og notifikationer er opdigtede. Interaktioner som likes og demosvar virker lokalt i den åbne side, men gemmes ikke på en server og deles ikke med andre. Shakr er ikke en Play Store-app.</p><button class="btn black" data-go="home">Tilbage til forsiden</button></section>`;}
function render(){const app=$("#app");const pages={home,articles:articlesPage,forum:forumPage,thread:threadPage,lexicon:lexiconPage,article:articlePage,search:searchPage,profile:profilePage,notifications:notificationsPage,about:aboutPage};app.innerHTML=(pages[currentPage]||home)();$$(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.go===currentPage||(currentPage==="thread"&&n.dataset.go==="forum")||(currentPage==="article"&&n.dataset.go==="articles")||(currentPage==="search"&&n.dataset.go==="home")));}
// Keyboard support for card-like interactive elements.
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-thread],[data-article],[data-go][role=button]")){e.preventDefault();e.target.click();}if(e.key==="Enter"&&(e.target.id==="global-search"||e.target.id==="home-search")){e.preventDefault();if(e.target.id==="home-search")searchTerm=e.target.value.trim();handleAction("global-submit",e.target);}});
document.addEventListener("click",e=>{const q=e.target.closest('[data-action="quick-search"]');if(q){searchTerm=q.dataset.value;go("search");}});
render();
</script>
</body>
</html>
